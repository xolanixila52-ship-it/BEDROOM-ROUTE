<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bedroom Route</title>
<style>
:root{--bg:#e8edeb;--ink:#14211f;--teal:#0f6b63;--amber:#f2a007;--red:#b42318;--line:#c5d0cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Segoe UI",system-ui,sans-serif}

:root{--bg:#050816;--ink:#e6edff;--teal:#06b6d4;--amber:#fbbf24;--red:#fb7185;--line:#26325e}
body{background:radial-gradient(900px 520px at 8% -10%,#4c1d95 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#0e7490 0,transparent 55%),#050816 fixed;color:var(--ink)}

.stage{background:#000;box-shadow:0 0 0 1px #22d3ee55,0 0 34px #7c3aed55}

.stage.lock .hud i{border-color:#34d399;filter:drop-shadow(0 0 8px #34d399)}.stage.lock .sl{display:none}.stage.lock{box-shadow:0 0 0 2px #34d399,0 0 36px #34d39966}

@media(prefers-reduced-motion:reduce){.sl,.orb,.cap{animation:none}}

<script id="bundled" type="application/json">{"published":true}</script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
let P,PUB=false,V='pt',U={},B={},stream=null,PD=null,RD=null,SEL=-1,ARM=null,NS='straight',LV={},timer=null;
const url=o=>PUB?`media/${o.id}.${o.ext}`:U[o.id],pn=()=>(!P.name||P.name=='My project')?'Bedroom route':P.name,blankP=()=>({name:'Bedroom route',points:[],routes:[],settings:{th:.8}});
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',5000)};
/* storage: metadata + blobs in IndexedDB */
const DB=()=>new Promise((r,j)=>{const q=indexedDB.open('navproject2',1);q.onupgradeneeded=()=>{q.result.createObjectStore('k');q.result.createObjectStore('b')};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const rq=q=>new Promise((r,j)=>{q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function load(){const d=await DB();P=await rq(d.transaction('k').objectStore('k').get('p'))||blankP();for(const k of await rq(d.transaction('b').objectStore('b').getAllKeys())){B[k]=await rq(d.transaction('b').objectStore('b').get(k));U[k]=URL.createObjectURL(B[k])}}
async function save(){if(PUB)return;try{const d=await DB();d.transaction('k','readwrite').objectStore('k').put(P,'p')}catch(e){toast('Save failed: '+e.message)}}
async function putB(id,b){B[id]=b;U[id]=URL.createObjectURL(b);try{const d=await DB();d.transaction('b','readwrite').objectStore('b').put(b,id)}catch(e){toast('Could not store file: '+e.message)}}
async function delB(o){if(!o)return;delete B[o.id];delete U[o.id];try{const d=await DB();d.transaction('b','readwrite').objectStore('b').delete(o.id)}catch(e){}}
const allMedia=()=>P.points.flatMap(p=>p.imgs);
/* recognition: small on-device image fingerprint (not a trained neural network) */
const nz=a=>{const m=a.reduce((s,v)=>s+v,0)/a.length,z=a.map(v=>v-m);let n=0;for(const v of z)n+=v*v;n=Math.sqrt(n)||1;return z.map(v=>v/n)};
function feat(s){const c=document.createElement('canvas');c.width=24;c.height=18;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(s,0,0,24,18);const d=x.getImageData(0,0,24,18).data,g=[],col=[];
 for(let i=0;i<432;i++)g.push(.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2]);
 for(let gy=0;gy<3;gy++)for(let gx=0;gx<4;gx++){let r=0,q=0,b=0;for(let y=0;y<6;y++)for(let u=0;u<6;u++){const i=((gy*6+y)*24+gx*6+u)*4;r+=d[i];q+=d[i+1];b+=d[i+2]}col.push(r/36,q/36,b/36)}
 return [...nz(g),...nz(col)].map(v=>+v.toFixed(3))}
const sim=(a,b,ea,eb)=>{let g=0,c=0;for(let i=0;i<432;i++)g+=a[i]*b[i];for(let i=432;i<468;i++)c+=a[i]*b[i];const fp=.7*g+.3*c;if(!ea||!eb||ea.length!=eb.length)return fp;let d=0;for(let i=0;i<ea.length;i++)d+=ea[i]*eb[i];return .8*d+.2*fp};
const match=(f,e)=>P.points.filter(p=>p.imgs.length).map(p=>{let bs=-9,bi=0;p.imgs.forEach((o,i)=>{const v=sim(f,o.f,e,o.e);if(v>bs){bs=v;bi=i}});return [p,bs,bi]}).sort((a,b)=>b[1]-a[1]);
/* arrows */
const PATH={straight:'<path d="M50 92V22M24 46L50 20L76 46"/>',left:'<path d="M64 92V64Q64 36 30 36M46 20L28 36L46 52"/>',right:'<g transform="translate(100 0) scale(-1 1)"><path d="M64 92V64Q64 36 30 36M46 20L28 36L46 52"/></g>',uturn:'<path d="M28 92V38Q28 12 50 12Q72 12 72 38V70M58 56L72 72L86 56"/>',chevrons:'<path class="c1" d="M22 80L50 58L78 80"/><path class="c2" d="M22 55L50 33L78 55"/><path class="c3" d="M22 30L50 8L78 30"/>',target:'<circle cx="50" cy="50" r="34"/><path d="M34 52L46 64L68 38"/>'};
const arrowHTML=(a,s)=>`<div class="ar ${s?'sel':''}" style="left:${a.x}%;top:${a.y}%;transform:rotate(${a.rot}deg) scale(${a.size})"><svg viewBox="0 0 100 100" class="a-${a.style}">${PATH[a.style]}</svg></div>`;
const ovHTML=(o,sel)=>(o.ar||[]).map((a,i)=>arrowHTML(a,i===sel)).join('');
const capHTML=o=>o.tx?`<div class="cap">${E(o.tx)}</div>`:'';
/* shell */
function go(k){stopLive();PD=ED=null;ARM=null;V=k;render()}
function render(){
 const tabs=PUB?[['live','Live guide']]:[['pt','Points'],['rt','Label'],['live','Live test'],['data','Data']];
 $('#app').innerHTML=`<header><b><span class="brand">${E(pn())}</span> <small style="opacity:.7;font-weight:400;font-size:13px">· powered by DAVID AI</small></b><span class="mode ${PUB?'nv':'bd'}">${PUB?'Navigation mode':'Builder mode'}</span></header>${PUB?'':`<nav>${tabs.map(([k,n])=>`<button class="${V==k?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}</nav>`}<main>${({pt:vPt,rt:vRt,live:vLive,data:vData})[V]()}</main>`;
 const v=$('#lv');if(v&&stream){v.srcObject=stream;v.play().catch(()=>{})}
 if(V=='rt'&&ED)upd();if(V=='live')show();
}
/* helpers */
const KN={start:'Starting points',via:'Ways through (passages)',dest:'Destinations'},KS={start:'Starting point',via:'Way through',dest:'Destination'},KO=['start','via','dest'];
let LK='start',ED=null,MN=null,busy=false;
const lab=o=>(o.ar&&o.ar.length)||o.tx;
const grp=fn=>KO.map(k=>{const l=P.points.filter(p=>p.kind==k);return l.length?`<h3>${KN[k]} (${l.length})</h3>`+l.map(fn).join(''):''}).join('');
const mig=()=>{P.routes=P.routes||[];for(const p of P.points)for(const o of p.imgs){o.ar=o.ar||[];o.tx=o.tx||''}for(const r of P.routes){const p=P.points.find(x=>x.id==r.from),o=p&&(p.imgs[r.bg||0]||p.imgs[0]);if(o&&r.arrows&&r.arrows.length&&!o.ar.length)o.ar=r.arrows.map(({style,x,y,rot,size})=>({style,x,y,rot,size}))}P.routes=[]};
/* AI model (MobileNet embeddings) + fingerprint */
async function ready(){if(MN||!window.mobilenet||!window.tf)return;try{MN=await mobilenet.load({version:2,alpha:1})}catch(e){MN=null}}
async function emb(src){if(!MN)return null;const t=MN.infer(src,true),d=await t.data();t.dispose();return nz(Array.from(d)).map(v=>+v.toFixed(3))}
async function prep(){for(const p of P.points)for(const o of p.imgs)if(!o.e){const im=new Image();im.src=url(o);try{await im.decode();const e=await emb(im);if(e)o.e=e}catch(x){}}save()}
/* points */
const ptCard=(p,btns)=>`<div class="card"><div class="grow"><b>${E(p.name||'Unnamed')}</b><div class="meta">${KS[p.kind]} · ${p.imgs.length} photos · ${p.imgs.filter(lab).length} labelled</div></div>${btns}<div class="thumbs" style="flex-basis:100%">${p.imgs.map(o=>`<img src="${url(o)}" alt="">`).join('')}</div></div>`;
function vPt(){
 if(PD)return `<h2>Point</h2><label>Name<input value="${E(PD.name)}" oninput="PD.name=this.value;save()" placeholder="Bedroom door"></label>
 <label>Type<select onchange="PD.kind=this.value;save()">${KO.map(k=>`<option value="${k}" ${PD.kind==k?'selected':''}>${KS[k]}</option>`).join('')}</select></label>
 <label class="btn pri">Add photos<input type="file" accept="image/*" multiple hidden onchange="addImgs(this)"></label>
 <p class="meta">Add several photos of this spot (different distance, angle and lighting). More photos make recognition more reliable.</p>
 <div class="thumbs">${PD.imgs.map((o,i)=>`<div><img src="${url(o)}" alt=""><button class="bad" onclick="rmImg(${i})">×</button></div>`).join('')}</div>
 <div class="row"><button class="pri" onclick="PD=null;render()">Done</button></div>`;
 return `<div class="row"><button class="pri" onclick="PD={id:uid(),name:'',kind:'start',imgs:[]};P.points.push(PD);save();render()">Add point</button></div>`+(P.points.length?grp(p=>ptCard(p,`<button onclick="PD=P.points.find(x=>x.id=='${p.id}');render()">Edit</button><button class="bad" onclick="delPt('${p.id}')">Delete</button>`)):'<p class="empty">No points yet. Add starting points, ways through, and destinations, each with photos. Then use the Label tab.</p>');
}
async function addImgs(i){for(const f of i.files){try{const bm=await createImageBitmap(f),k=Math.min(1,800/bm.width),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 const id=uid(),e=await emb(c);await putB(id,await new Promise(r=>c.toBlob(r,'image/jpeg',.8)));PD.imgs.push({id,ext:'jpg',mime:'image/jpeg',f:feat(c),...(e?{e}:{}),ar:[],tx:''})}catch(x){toast(f.name+' is not a readable image.')}}save();render()}
async function rmImg(i){await delB(PD.imgs[i]);PD.imgs.splice(i,1);save();render()}
async function delPt(id){if(!confirm('Delete this point and its photos?'))return;const p=P.points.find(x=>x.id==id);for(const o of p.imgs)await delB(o);P.points=P.points.filter(x=>x.id!=id);save();render()}
/* label: arrows + wording on each photo */
const cur=()=>{const p=P.points.find(x=>x.id==ED.p);return p&&p.imgs[ED.i]};
const prog=k=>{const l=P.points.filter(p=>p.kind==k).flatMap(p=>p.imgs);return l.filter(lab).length+'/'+l.length};
function vRt(){
 if(!P.points.some(p=>p.imgs.length))return '<p class="empty">Add points with photos in the Points tab first.</p>';
 if(ED){const p=P.points.find(x=>x.id==ED.p),o=cur(),d=p.kind=='dest';
  return `<h2>${E(p.name||'Unnamed')}</h2><p class="meta">${KS[p.kind]} · photo ${ED.i+1} of ${p.imgs.length}</p>
 <div class="stage"><img id="ev" src="${url(o)}" alt=""><div id="ov" class="ov ${ARM!==null?'arm':''}" onclick="place(event)"></div></div>
 ${d?'<p class="meta">Destination: add wording only.</p>':`<p class="meta">${ARM!==null?'Tap the picture where the arrow should go.':'Choose a style, then tap Place arrow.'}</p>
 <div class="row"><select onchange="NS=this.value" style="flex:1">${Object.keys(PATH).map(k=>`<option ${k==NS?'selected':''}>${k}</option>`).join('')}</select><button class="pri" onclick="ARM='new';render()">Place arrow</button></div><div id="al">${rowsHTML()}</div>`}
 <label>Wording (shown at the bottom of the camera view)<input value="${E(o.tx||'')}" oninput="cur().tx=this.value;save();upd()" placeholder="Turn left at the door"></label>
 <div class="row"><button onclick="ED=null;ARM=null;render()">All photos</button><button class="pri" onclick="nextImg()">Save &amp; next</button></div>`}
 return `<div class="row">${KO.map((k,n)=>`<button class="${LK==k?'on':''}" style="flex:1" onclick="LK='${k}';render()">${n+1}. ${KS[k]} ${prog(k)}</button>`).join('')}</div>
 <p class="meta">Tap a photo to label it. Teal outline = labelled, dashed = still to do.${LK=='dest'?' Destinations only need wording.':''}</p>`+
 (P.points.filter(p=>p.kind==LK).map(p=>`<div class="card"><div class="grow"><b>${E(p.name||'Unnamed')}</b></div><div class="thumbs" style="flex-basis:100%">${p.imgs.map((o,i)=>`<div><img src="${url(o)}" alt="" onclick="ED={p:'${p.id}',i:${i}};SEL=-1;render()" style="cursor:pointer;outline:${lab(o)?'4px solid var(--teal)':'3px dashed var(--amber)'}"></div>`).join('')||'<span class="meta">No photos</span>'}</div></div>`).join('')||`<p class="empty">No ${KN[LK].toLowerCase()} yet. Add them in the Points tab.</p>`);
}
function nextImg(){const L=KO.flatMap(k=>P.points.filter(p=>p.kind==k).flatMap(p=>p.imgs.map((o,i)=>({p:p.id,i,k})))),n=L.findIndex(x=>x.p==ED.p&&x.i==ED.i)+1;ARM=null;SEL=-1;if(L[n]){ED={p:L[n].p,i:L[n].i};LK=L[n].k}else{ED=null;toast('Every photo is done. Try Live test.')}render()}
const rowsHTML=()=>cur().ar.map((a,i)=>`<div class="st ${i==SEL?'sel':''}"><div class="row"><select onchange="cur().ar[${i}].style=this.value;SEL=${i};save();upd()">${Object.keys(PATH).map(k=>`<option ${k==a.style?'selected':''}>${k}</option>`).join('')}</select><button onclick="SEL=${i};upd();ral()">Show</button><button onclick="SEL=${i};ARM=${i};render()">Move</button><button class="bad" onclick="cur().ar.splice(${i},1);SEL=-1;save();upd();ral()">Delete</button></div>
 <label>Rotate <input type="range" min="-180" max="180" value="${a.rot}" oninput="cur().ar[${i}].rot=+this.value;SEL=${i};save();upd()"></label><label>Size <input type="range" min="40" max="250" value="${a.size*100}" oninput="cur().ar[${i}].size=this.value/100;SEL=${i};save();upd()"></label></div>`).join('')||'<p class="empty">No arrows yet.</p>';
const ral=()=>{const e=$('#al');if(e)e.innerHTML=rowsHTML()};
function upd(){const o=$('#ov');if(o&&ED){const im=cur(),p=P.points.find(x=>x.id==ED.p);o.innerHTML=(p.kind=='dest'?'':ovHTML(im,SEL))+capHTML(im)}}
function place(ev){if(ARM===null)return;const r=ev.currentTarget.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*100,y=(ev.clientY-r.top)/r.height*100,o=cur();
 if(ARM==='new'){o.ar.push({style:NS,x,y,rot:0,size:1});SEL=o.ar.length-1}else Object.assign(o.ar[ARM],{x,y});ARM=null;save();render()}
/* live: AI scoring. Every photo gets a smoothed score; an image holds the screen until another beats it by the margin */
const mg=()=>P.settings.mg||.10,dot=(a,b)=>{let d=0;for(let k=0;k<a.length;k++)d+=a[k]*b[k];return d};
async function embs(v){if(!MN)return[];const c=document.createElement('canvas'),w=v.videoWidth,h=v.videoHeight;c.width=c.height=224;const x=c.getContext('2d'),o=[];x.drawImage(v,0,0,224,224);o.push(await emb(c));x.drawImage(v,w*.15,h*.15,w*.7,h*.7,0,0,224,224);o.push(await emb(c));return o}
async function startLive(){try{toast('AI is starting…');await ready();await prep();if(!MN)toast('AI model could not load (needs internet). Using basic matching.');
 const cen={};for(const p of P.points){const es=p.imgs.map(o=>o.e).filter(Boolean);if(es.length){const m=new Array(es[0].length).fill(0);es.forEach(e=>e.forEach((v,k)=>m[k]+=v));cen[p.id]=nz(m)}}
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640}}});LV={S:{},hold:null,cen};render();timer=setInterval(scan,450)}catch(e){toast('Camera unavailable ('+e.name+'). Allow camera access and use HTTPS.')}}
function stopLive(){clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;LV={}}
async function scan(){if(busy)return;const v=$('#lv');if(!v||!v.videoWidth||!LV.S)return;busy=true;try{const f=feat(v),es=await embs(v),it=[];
 for(const p of P.points)p.imgs.forEach((o,i)=>{const fp=sim(f,o.f),k=p.id+':'+i;let r=fp;if(es.length&&o.e){const own=Math.max(...es.map(e=>dot(e,o.e))),c=LV.cen[p.id]?Math.max(...es.map(e=>dot(e,LV.cen[p.id]))):own;r=.55*own+.25*c+.2*fp}
  LV.S[k]=LV.S[k]===undefined?r:.5*LV.S[k]+.5*r;it.push({k,p,i,s:LV.S[k]})});
 it.sort((a,b)=>b.s-a.s);const best=it[0];if(!best)return;const oth=it.find(x=>x.p.id!=best.p.id),lead=oth?best.s-oth.s:1,m=mg(),cp=LV.hold&&LV.hold.split(':')[0];
 if(lead>=m||(cp&&best.p.id==cp))LV.hold=best.k;
 const sc=$('#sc');if(sc)sc.innerHTML=it.slice(0,4).map(x=>`<div class="bar ${x.k==LV.hold?'hold':''}"><span>${E(x.p.name||'?')} · photo ${x.i+1}</span><em>${Math.round(Math.max(0,x.s)*100)}%</em><b style="width:${Math.max(2,Math.min(100,x.s*100))}%"></b></div>`).join('');
 show()}catch(e){}finally{busy=false}}
function show(){const o=$('#lvo'),st=$('#lst'),sg=$('#stg'),at=$('#at');if(!o)return;const k=LV.hold;if(sg)sg.classList.toggle('lock',!!k);if(LV.shown===k&&o.dataset.k===String(k))return;LV.shown=k;o.dataset.k=k;
 if(!k){o.innerHTML='';if(at)at.innerHTML='';if(st)st.innerHTML='Scanning for a known place…';return}
 const [pid,i]=k.split(':'),p=P.points.find(x=>x.id==pid),im=lab(p.imgs[i]||{})?p.imgs[i]:(p.imgs.find(lab)||{});o.innerHTML=(p.kind=='dest'?'':ovHTML(im,-1))+capHTML(im);const t=(p.kind=='dest'?'Destination reached':'You are at')+': <b>'+E(p.name)+'</b>';if(at)at.innerHTML=t;if(st)st.innerHTML=t}
function vLive(){
 if(!P.points.some(p=>p.imgs.some(lab)))return `<p class="empty">${PUB?'This guide is empty.':'Add points with photos, then label them in the Label tab first.'}</p>`;
 return stream?`<div class="stage" id="stg"><video id="lv" playsinline muted autoplay style="max-height:none"></video><div id="lvo" class="ov"></div><div id="at" class="at"></div><div class="hud"><i></i><i></i><i></i><i></i><div class="sl"></div></div></div><div id="lst" class="big">Scanning for a known place…</div><div id="sc"></div>
 <label>Switch margin: ${Math.round(mg()*100)}% <span class="meta">(the top photo must lead the rest by this much)</span><input type="range" min="5" max="30" value="${Math.round(mg()*100)}" onchange="P.settings.mg=this.value/100;save();render()"></label><div class="row"><button onclick="stopLive();render()">Stop camera</button></div><p class="meta pw">Powered by DAVID AI</p>`
 :`<div class="hero"><div class="orb"></div><h2 class="brand">${E(pn())}</h2><p class="meta">Move around with the camera. The AI scores every photo you labelled. When one is ${Math.round(mg()*100)}% or more above the rest, its arrows and wording appear on the live view, and they switch when a different photo is ${Math.round(mg()*100)}% or more above the rest.</p><button class="pri" onclick="startLive()">Start camera</button><p class="meta pw">Powered by DAVID AI</p></div>`}
/* data */
function vData(){return `<h2>Project</h2><label>Project name<input value="${E(P.name)}" oninput="P.name=this.value;save()"></label><p class="meta">${P.points.length} points · ${P.points.flatMap(p=>p.imgs).filter(lab).length} labelled photos · ${allMedia().length} media files. All stored in this browser until exported.</p>
 <div class="row"><button class="pri" onclick="zip(false)">Export / back up project (.zip)</button><label class="btn">Import / restore (.zip)<input type="file" accept=".zip" hidden onchange="imp(this)"></label></div>
 <h2>Publish</h2><p class="meta">Creates a .zip containing index.html, data.json and a media folder. Unzip it and upload the folder to a static host over HTTPS (Netlify Drop, GitHub Pages, Cloudflare Pages). Visitors get Live guide only.</p>
 <div class="row"><button class="pri" onclick="zip(true)">Export publishable website (.zip)</button></div><div class="row"><button class="bad" onclick="clr()">Clear project</button></div>`}
async function zip(pub){try{if(!window.JSZip)return toast('The zip tool did not load. Connect to the internet and reload this page.');if(pub&&!P.points.some(p=>p.imgs.some(lab)))return toast('Label at least one photo before publishing.');
 const z=new JSZip();z.file('data.json',JSON.stringify({format:'nav2',...P}));for(const o of allMedia())if(B[o.id])z.file(`media/${o.id}.${o.ext}`,B[o.id]);
 if(pub){const c=document.documentElement.cloneNode(true);c.querySelector('#bundled').textContent='{"published":true}';c.querySelector('#app').innerHTML='';c.querySelector('#toast').style.display='none';z.file('index.html','<!DOCTYPE html>\n'+c.outerHTML)}
 const a=document.createElement('a');a.href=URL.createObjectURL(await z.generateAsync({type:'blob'}));a.download=(pub?'site-':'project-')+new Date().toISOString().slice(0,10)+'.zip';a.click();toast('Exported')}catch(e){toast('Export failed: '+e.message)}}
async function imp(i){const f=i.files[0];i.value='';if(!f)return;try{const z=await JSZip.loadAsync(f),d=JSON.parse(await z.file('data.json').async('string'));if(d.format!=='nav2'||!Array.isArray(d.points)||!Array.isArray(d.routes))throw Error('Not a Route Builder project.');
 if(!confirm(`Replace the current project with ${d.points.length} points?`))return;
 const np={name:d.name,points:d.points,routes:d.routes,settings:d.settings||{th:.8}},old=allMedia();for(const o of old)await delB(o);P=np;mig();
 for(const o of allMedia()){const e=z.file(`media/${o.id}.${o.ext}`);if(!e)throw Error('Missing file '+o.id+'.'+o.ext);await putB(o.id,new Blob([await e.async('arraybuffer')],{type:o.mime}))}save();render();toast('Imported')}catch(e){toast('Import failed: '+e.message)}}
async function clr(){if(!confirm('Delete everything from this browser? Export a backup first.'))return;for(const o of allMedia())await delB(o);P=blankP();save();render()}
(async()=>{const b=JSON.parse($('#bundled').textContent);if(b){PUB=true;V='live';try{P=await(await fetch('data.json')).json()}catch(e){P=blankP();toast('Could not load data.json. Open this site from a web host, not by double-clicking the file.')}}else{try{await load()}catch(e){P=blankP();toast('Saved data could not be loaded: '+e.message)}}mig();render()})();
</script>
